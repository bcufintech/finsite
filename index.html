async function doCheck(evId,regId,known){const rf=doc(db,"registrations",evId+"_"+regId);

    if(r.s==="ok"){S.cnt=(S.cnt||0)+1;{const c=$("#cnt");if(c)c.textContent=S.cnt}const x=S.regs.find(q=>q.regId===regId&&q.eventId===evId);if(x)x.checkedIn=true;if($("#rl")&&S.regs.length)drawRegs("",S.role==="admin")}if(r.s==="dup")addDoc(collection(db,"auditLogs"),{action:"duplicate",reg:rf.id,by:S.user.uid,at:serverTimestamp()}).catch(()=>{});return r}catch(x){return{s:"bad",m:x.code==="permission-denied"?"Permission denied. Ask the admin to publish the latest Firestore rules and add you to this event's desk team.":"Could not check in: "+(x.message||x.code||"error")}}}

  $("#fb").onclick=async()=>{const v=$("#ph").value.replace(/\D/g,"");

    $("#res").innerHTML=!rs.length?`<div class="res bad">${esc(err||"No registration found for this number.")}</div>`:rs.map(r=>`<div class="card" style="margin-top:12px"><b>${esc(r.name)}</b> · ${r.regId}${ALL?`<br><span class="muted">${esc(EN(r.eventId))}</span>`:""}<br>${esc(r.email)}<br>${r.checkedIn?`<span class="pill">Already entered</span>`:`<button class="btn" style="margin-top:8px" data-ck="${r.regId}" data-ev="${r.eventId||S.evId}">Mark entered</button>`}</div>`).join("");

  $("#sc").onclick=async()=>{stopCam();

const GAS_TPL=String.raw`// FINSITE mailer. Paste this whole file into script.google.com, then Deploy > New deployment > Web app.
// Execute as: Me. Who has access: Anyone. Only signed-in FINSITE admins can send (checked on every call).
const PROJECT_ID = "__PID__";
const API_KEY = "__KEY__";
const SENDER_NAME = "FINSPIRE - M.Com Fintech, BCU";
const MAX_PER_CALL = 50;
const MAX_PASS_PER_HOUR = 60;

function doGet() { return out_({ ok: true, info: "FINSITE mailer v3 (registration pass + team certificates)" }); }

// Run this ONCE from the editor (select "authorize" > Run) to grant mail + network permission.
function authorize() {
  Logger.log("Mail quota left: " + MailApp.getRemainingDailyQuota());
  UrlFetchApp.fetch("https://www.google.com", { muteHttpExceptions: true });
}

function doPost(e) {
  try {
    const b = JSON.parse(e.postData.contents);
    if (b.action === "pass") return pass_(b);
    if (!admin_(b.token)) return out_({ ok: false, error: "Only admins can send mail." });
    const mails = b.mails || [];
    if (!mails.length || mails.length > MAX_PER_CALL) return out_({ ok: false, error: "Bad batch size." });
    const left = MailApp.getRemainingDailyQuota();
    if (mails.length > left) return out_({ ok: false, error: "Daily mail limit reached. Left today: " + left });
    let sent = 0;
    const failed = [];
    mails.forEach(function (m) {
      try {
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.to)) throw new Error("bad address");
        const o = { to: m.to, subject: String(m.subject || "").slice(0, 200), htmlBody: String(m.html || ""), name: SENDER_NAME };
        if (m.replyTo && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.replyTo)) o.replyTo = m.replyTo;
        if (m.attachments && m.attachments.length) {
          o.attachments = m.attachments.slice(0, 10).map(function (a) {
            return Utilities.newBlob(Utilities.base64Decode(a.data), a.type || "image/jpeg", a.filename || "file");
          });
        }
        MailApp.sendEmail(o);
        sent++;
      } catch (err) { failed.push(m.to); }
    });
    return out_({ ok: true, sent: sent, failed: failed, quota: MailApp.getRemainingDailyQuota() });
  } catch (err) {
    return out_({ ok: false, error: String(err.message || err) });
  }
}

// Public: emails a participant their own pass right after they register.
// It checks that the event is published, that this email registered for it in the last 15 minutes,
// and sends at most one pass per email per event.
function pass_(b) {
  try {
    const eid = String(b.eventId || ""), rid = String(b.regId || ""), email = String(b.email || "").trim().toLowerCase(), name = String(b.name || "").slice(0, 100);
    if (!/^[A-Za-z0-9_-]{1,64}$/.test(eid) || !/^[0-9]{6}$/.test(rid) || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return out_({ ok: false, error: "Bad request." });
    const props = PropertiesService.getScriptProperties(), key = "pass_" + eid + "_" + email;
    if (props.getProperty(key)) return out_({ ok: true, sent: 0, info: "Already sent." });
    const cache = CacheService.getScriptCache(), hk = "ph_" + Math.floor(Date.now() / 3600000), n = Number(cache.get(hk) || 0);
    if (n >= MAX_PASS_PER_HOUR) return out_({ ok: false, error: "Busy. Try again later." });
    const base = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents/";
    // Event details are cached for 6 hours, so only the first pass of an event reads the event document.
    let info = null;
    const evc = cache.get("ev_" + eid);
    if (evc) { try { info = JSON.parse(evc); } catch (err) {} }
    if (!info) {
      const ev = UrlFetchApp.fetch(base + "events/" + encodeURIComponent(eid) + "?key=" + API_KEY, { muteHttpExceptions: true });
      if (ev.getResponseCode() !== 200) return out_({ ok: false, error: "Event not found." });
      const ef = JSON.parse(ev.getContentText()).fields || {};
      const st = (ef.status || {}).stringValue;
      if (st !== "published" && st !== "closed") return out_({ ok: false, error: "Event not open." });
      info = { name: String((ef.name || {}).stringValue || "the event"), date: String((ef.date || {}).stringValue || ""), venue: String((ef.venue || {}).stringValue || "") };
      cache.put("ev_" + eid, JSON.stringify(info), 21600);
    }
    const em = UrlFetchApp.fetch(base + "emails/" + encodeURIComponent(eid + "_" + encodeURIComponent(email)) + "?key=" + API_KEY, { muteHttpExceptions: true });
    if (em.getResponseCode() !== 200) return out_({ ok: false, error: "Registration not found." });
    const at = ((JSON.parse(em.getContentText()).fields || {}).at || {}).timestampValue;
    if (!at || Date.now() - new Date(at).getTime() > 15 * 60 * 1000) return out_({ ok: false, error: "Registration is too old." });
    const evName = info.name, evDate = info.date, evVenue = info.venue;
    let qr = null;
    try { qr = UrlFetchApp.fetch("https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=" + encodeURIComponent("FINSITE:" + eid + ":" + rid)).getBlob().setName("pass-qr.png"); } catch (err) {}
    const html = '<div style="font-family:Arial,sans-serif;max-width:480px;margin:auto;color:#14231E">' +
      '<p>Hi ' + esc_(name) + ',</p><p>You are registered for <b>' + esc_(evName) + '</b>. Here is your pass.</p>' +
      '<div style="border:1px solid #C9D9CE;border-radius:12px;padding:18px;text-align:center;background:#F3F7F4">' +
      '<div style="font-size:12px;letter-spacing:2px;color:#4B5F57">REGISTRATION ID</div>' +
      '<div style="font-size:34px;font-weight:bold;letter-spacing:4px;margin:6px 0 12px">' + esc_(rid) + '</div>' +
      (qr ? '<img src="cid:qr" width="200" height="200" alt="QR code">' : '') +
      '<div style="margin-top:12px"><b>' + esc_(name) + '</b><br>' + esc_(evDate) + (evVenue ? ' · ' + esc_(evVenue) : '') + '</div></div>' +
      '<p>Show this QR code or your ID at the entrance. Carry your college ID card at all times.</p>' +
      '<p style="color:#4B5F57;font-size:12px">FINSPIRE · Department of Studies and Research in Commerce, Dr. Manmohan Singh Bengaluru City University</p></div>';
    const o = { to: email, subject: "Your pass: " + evName, htmlBody: html, name: SENDER_NAME };
    if (qr) { o.inlineImages = { qr: qr }; o.attachments = [qr]; }
    MailApp.sendEmail(o);
    props.setProperty(key, "1");
    cache.put(hk, String(n + 1), 3700);
    return out_({ ok: true, sent: 1 });
  } catch (err) {
    return out_({ ok: false, error: String(err.message || err) });
  }
}

function esc_(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

// Admin check is remembered for 10 minutes so a whole certificate run costs one lookup, not one per batch.
function admin_(token) {
  const cache = CacheService.getScriptCache();
  const k = "adm_" + Utilities.base64EncodeWebSafe(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, String(token))).slice(0, 40);
  if (cache.get(k)) return true;
  const uid = verify_(token);
  if (roleOf_(uid, token) !== "admin") return false;
  cache.put(k, "1", 600);
  return true;
}

function verify_(token) {
  const r = UrlFetchApp.fetch("https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=" + API_KEY, {
    method: "post", contentType: "application/json", payload: JSON.stringify({ idToken: token }), muteHttpExceptions: true
  });
  if (r.getResponseCode() !== 200) throw new Error("Sign-in expired. Sign in to FINSITE again.");
  return JSON.parse(r.getContentText()).users[0].localId;
}

function roleOf_(uid, token) {
  const r = UrlFetchApp.fetch("https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents/admins/" + uid, {
    headers: { Authorization: "Bearer " + token }, muteHttpExceptions: true
  });
  if (r.getResponseCode() !== 200) return "";
  const f = JSON.parse(r.getContentText()).fields || {};
  return String((f.role || f.Role || {}).stringValue || "").trim().toLowerCase();
}

function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
`;

/* ============ FIREBASE RULES ============ */
const FS_RULES=String.raw`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // ---------- helpers ----------
    function signedIn() { return request.auth != null; }
    function adminPath() { return /databases/$(database)/documents/admins/$(request.auth.uid); }
    function role() {
      return signedIn() && exists(adminPath()) ? get(adminPath()).data.get('role', '') : '';
    }
    function isAdmin() { return role() == 'admin'; }
    function isStaff() { return role() == 'admin' || role() == 'coordinator' || role() == 'desk'; }
    function eventDoc(id) { return get(/databases/$(database)/documents/events/$(id)).data; }
    function isCoordOf(id) {
      return role() == 'coordinator'
        && request.auth.uid in eventDoc(id).get('coordinatorUids', []);
    }
    function isDeskOf(id) {
      return role() == 'desk'
        && (request.auth.uid in eventDoc(id).get('deskUids', [])
            || eventDoc(id).get('deskUids', []).size() == 0);
    }

    // ---------- team (admins collection) ----------
    // Each signed-in user may read only their own doc (needed to find their role).
    match /admins/{uid} {
      allow get: if signedIn() && (request.auth.uid == uid || isAdmin());
      allow list: if isAdmin();
      allow write: if isAdmin();
    }

    // ---------- events ----------
    match /events/{eventId} {
      allow read: if resource.data.status in ['published', 'closed']
                  || isAdmin()
                  || (signedIn() && role() == 'coordinator'
                      && request.auth.uid in resource.data.get('coordinatorUids', []))
                  || (signedIn() && role() == 'desk'
                      && request.auth.uid in resource.data.get('deskUids', []));
      allow create, delete: if isAdmin();
      allow update: if isAdmin()
        || (isCoordOf(eventId)
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly([
                 'date','start','end','venue','contactEmail','contactPhone',
                 'description','factsText','rulesText','judgingText','winner','questions',
                 'editedBy','editedAt']));
    }

    // ---------- general regulations ----------
    match /settings/{docId} {
      allow read: if true;
      allow write: if isAdmin();
    }

    // ---------- registrations ----------
    match /registrations/{regDocId} {
      // Public sign-up: create only, never read/update/delete.
      allow create: if (isAdmin())
        || (request.resource.data.keys().hasOnly(
              ['eventId','regId','name','email','phone','answers','checkedIn','createdAt'])
            && request.resource.data.keys().hasAll(
              ['eventId','regId','name','email','phone','checkedIn','createdAt'])
            && request.resource.data.eventId is string
            && request.resource.data.regId is string
            && request.resource.data.regId.matches('^[0-9]{6}$')
            && regDocId == request.resource.data.eventId + '_' + request.resource.data.regId
            && request.resource.data.name is string
            && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 100
            && request.resource.data.email is string
            && request.resource.data.email.size() <= 200
            && request.resource.data.email.matches('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
            && request.resource.data.phone is string
            && request.resource.data.phone.matches('^[6-9][0-9]{9}$')
            && request.resource.data.email == request.resource.data.email.lower()
            && (!('answers' in request.resource.data) || (request.resource.data.answers is map && request.resource.data.answers.size() <= 30))
            && request.resource.data.checkedIn == false
            && request.resource.data.createdAt == request.time
            && eventDoc(request.resource.data.eventId).status == 'published');

      allow read: if isAdmin() || isCoordOf(resource.data.eventId) || isDeskOf(resource.data.eventId);

      // Admin: anything (e.g. reverse check-in, restore).
      // Entry desk: may only flip checkedIn false -> true, stamped with own uid.
      // Coordinators can no longer check people in; they only see the result.
      // Coordinator: may correct name, email, mobile and form answers for their own event only.
      allow update: if isAdmin()
        || (isCoordOf(resource.data.eventId)
            && request.resource.data.diff(resource.data).affectedKeys()
                 .hasOnly(['name','email','phone','answers','editedBy','editedAt'])
            && request.resource.data.name is string
            && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 100
            && request.resource.data.email is string
            && request.resource.data.email.size() <= 200
            && request.resource.data.email.matches('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
            && request.resource.data.email == request.resource.data.email.lower()
            && request.resource.data.phone is string
            && request.resource.data.phone.matches('^[6-9][0-9]{9}$')
            && request.resource.data.get('answers', {}) is map
            && request.resource.data.get('answers', {}).size() <= 30
            && request.resource.data.editedBy == request.auth.uid
            && request.resource.data.editedAt == request.time)
        || (isDeskOf(resource.data.eventId)
            && request.resource.data.diff(resource.data).affectedKeys()
                 .hasOnly(['checkedIn','checkedInAt','checkedInBy'])
            && resource.data.checkedIn == false
            && request.resource.data.checkedIn == true
            && request.resource.data.checkedInBy == request.auth.uid
            && request.resource.data.checkedInAt == request.time);

      allow delete: if isAdmin();
    }

    // ---------- duplicate-email guard (one registration per email per event) ----------
    match /emails/{emailDocId} {
      // get is public so the mailer can confirm a fresh registration before it emails a pass.
      // It only reveals whether one email is registered for one event. Listing stays admin only.
      allow get: if true;
      allow list: if isAdmin();
      allow create: if isAdmin()
        || (request.resource.data.keys().hasOnly(['at'])
            && request.resource.data.at == request.time
            && eventDoc(emailDocId.split('_')[0]).status == 'published')
        || isCoordOf(emailDocId.split('_')[0]);
      allow update: if isAdmin();
      allow delete: if isAdmin() || isCoordOf(emailDocId.split('_')[0]);
    }

    // ---------- results ----------
    match /results/{eventId} {
      allow read: if resource.data.status == 'published'
                  || isAdmin()
                  || isCoordOf(eventId);
      // Coordinator submits (cannot publish, cannot edit after publish).
      allow create: if isAdmin()
        || (isCoordOf(eventId)
            && request.resource.data.keys().hasOnly(
                 ['summary','fileUrl','status','submittedBy','submittedAt'])
            && request.resource.data.status == 'submitted'
            && request.resource.data.submittedBy == request.auth.uid
            && request.resource.data.submittedAt == request.time);
      allow update: if isAdmin()
        || (isCoordOf(eventId)
            && resource.data.status != 'published'
            && request.resource.data.keys().hasOnly(
                 ['summary','fileUrl','status','submittedBy','submittedAt'])
            && request.resource.data.status == 'submitted'
            && request.resource.data.submittedBy == request.auth.uid
            && request.resource.data.submittedAt == request.time);
      allow delete: if isAdmin();
    }

    // ---------- private settings (Google Script mail URL) ----------
    match /private/{docId} { allow read, write: if isAdmin(); }

    // ---------- public updates (shown on the landing page) ----------
    match /updates/{id} {
      allow read: if true;
      allow write: if isAdmin();
    }

    // ---------- admin-only collections ----------
    match /certs/{eventId}      { allow read, write: if isAdmin(); }
    match /volunteers/{id}      { allow read, write: if isAdmin(); }

    // ---------- audit log (append-only) ----------
    match /auditLogs/{id} {
      allow read: if isAdmin();
      allow create: if isStaff()
        && request.resource.data.keys().hasOnly(['action','reg','by','at'])
        && request.resource.data.by == request.auth.uid
        && request.resource.data.at == request.time
        && (isAdmin() || request.resource.data.action == 'duplicate');
      allow update, delete: if false;
    }

    // Everything else is closed.
    match /{document=**} { allow read, write: if false; }
  }
}
`;
const ST_RULES=String.raw`rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {

    function role() {
      return request.auth != null
        && firestore.exists(/databases/(default)/documents/admins/$(request.auth.uid))
        ? firestore.get(/databases/(default)/documents/admins/$(request.auth.uid)).data.get('role', '') : '';
    }
    // Admins anywhere; coordinators only for the events assigned to them.
    function canManage(eventId) {
      return role() == 'admin'
        || (role() == 'coordinator'
            && request.auth.uid in firestore.get(/databases/(default)/documents/events/$(eventId)).data.get('coordinatorUids', []));
    }

    // Results files: staff upload (max 10 MB, PDF / sheet / image), anyone with the link can view.
    match /results/{eventId}/{fileName} {
      allow read: if true;
      allow write: if canManage(eventId)
        && request.resource.size < 10 * 1024 * 1024
        && request.resource.contentType.matches('application/pdf|image/(png|jpeg|webp|gif)|application/vnd[.].*|text/csv');
      allow delete: if canManage(eventId);
    }

    match /{allPaths=**} { allow read, write: if false; }
  }
}
`;
function rulesTab(){const box=(id,t,sub,code)=>`<div class="card" style="margin-bottom:18px"><div class="row"><h3 style="margin:0">${t}</h3><span class="fit"><button class="btn sm" data-cp="${id}">Copy</button></span></div><p class="muted">${sub}</p><pre id="${id}" style="max-height:420px;overflow:auto;background:#0f1b2d;color:#e6edf7;padding:14px;border-radius:8px;font-size:12px;line-height:1.5;white-space:pre">${esc(code)}</pre></div>`;
  $("#pane").innerHTML=`<p class="muted">Paste each block in the Firebase console and press <b>Publish</b>. Firestore: Build → Firestore Database → Rules. Storage: Build → Storage → Rules. Roles must be stored in lowercase (<code>admin</code> or <code>coordinator</code>) in the <code>admins</code> collection.</p>`
   +box("fsr","Firestore rules","Public: view published events, regulations, published results, and register. Coordinators: only their events (details, results, see registrants). Entry desk: check-in only, for events assigned to them or events with no desk team assigned. Admin: everything.",FS_RULES)
   +box("str","Storage rules","Result-file uploads by coordinators and admins only.",ST_RULES)
   +`<div class="card mist"><h3>Notes</h3><p class="muted">1. Create the first admin by hand: Authentication → add user, then Firestore → <code>admins/&lt;that UID&gt;</code> with fields <code>name</code>, <code>email</code>, <code>role: "admin"</code>.<br>2. The "already registered" check needs public read of a single <code>emails</code> document, so someone could test whether a known email is registered. Listing is blocked.<br>3. Event capacity (<code>max</code>) and the registration deadline are checked in the page only; rules cannot count documents.<br>4. Only two emails are sent, both through your Google Apps Script web app: the registration ID + QR pass (checked against the new registration) and the participation certificate (admin login checked). Publish the <code>private</code> rule above so the script URL settings stay admin-only.</p></div>`;
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=async()=>{const t=document.getElementById(b.dataset.cp).textContent;try{await navigator.clipboard.writeText(t);b.textContent="Copied"}catch(_){const r=document.createRange();r.selectNode(document.getElementById(b.dataset.cp));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent="Selected, press Ctrl+C"}setTimeout(()=>b.textContent="Copy",2500)})}

/* ============ FULL BACKUP ============ */
const COLS=["events","certs","results","volunteers","registrations","updates"];
const ser=v=>v&&typeof v.toMillis==="function"?{__ts:v.toMillis()}:Array.isArray(v)?v.map(ser):v&&typeof v==="object"?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,ser(x)])):v;
const des=v=>Array.isArray(v)?v.map(des):v&&typeof v==="object"?(Object.keys(v).length===1&&v.__ts!==undefined?Timestamp.fromMillis(v.__ts):Object.fromEntries(Object.entries(v).map(([k,x])=>[k,des(x)]))):v;
function backupUI(evs,N){$("#pane .grid").insertAdjacentHTML("beforeend",`<div class="card"><h3>Full backup</h3><p class="muted">Events, regulations, certificate designs, results, volunteers and registrations in one file. Team logins are not included.</p><p class="row"><button class="btn" id="bx">Export all (.json)</button><button class="btn alt" id="bxl">Export all (Excel)</button></p><label>Restore from a backup file<input type="file" id="bf" accept=".json"></label><p><button class="btn alt" id="bi">Import backup</button></p><p id="bm" class="muted"></p></div>`);
  const m=t=>$("#bm").textContent=t;
  $("#bx").onclick=async()=>{m("Collecting data…");try{const out={app:"finsite",version:1,at:new Date().toISOString(),data:{}};for(const c of COLS)out.data[c]=(await getDocs(collection(db,c))).docs.map(d=>({_id:d.id,d:ser(d.data())}));const g=await getDoc(doc(db,"settings","general"));out.data.settings=g.exists()?[{_id:"general",d:g.data()}]:[];dl(new Blob([JSON.stringify(out)],{type:"application/json"}),"finsite-backup-"+new Date().toISOString().slice(0,10)+".json");m("Backup downloaded.")}catch(x){m("Export failed: "+x.message)}};
  $("#bxl").onclick=async()=>{m("Collecting data…");try{await loadX();const w=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(r.map(o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,safe(v)])))),n);
    add("Events",evs.map(e=>({Name:e.name,Date:e.date,Start:e.start||"",End:e.end||"",Venue:e.venue,Status:e.status,Coordinators:e.coordNames||"",Max:e.max||""})));
    add("Registrations",(await getDocs(collection(db,"registrations"))).docs.map(d=>d.data()).map(r=>({Event:N[r.eventId]||r.eventId,ID:r.regId,Name:r.name,Email:r.email,Mobile:r.phone||"",...r.answers,"Checked in":r.checkedIn?"Yes":"No"})));
    add("Volunteers",(await getDocs(collection(db,"volunteers"))).docs.map(d=>d.data()).map(v=>({Name:v.name,Mobile:v.phone,Email:v.email,Event:N[v.eventId]||"All",Role:v.role})));
    XLSX.writeFile(w,"finsite-all.xlsx");m("Excel downloaded.")}catch(x){m("Export failed: "+x.message)}};
  $("#bi").onclick=async()=>{const f=$("#bf").files[0];if(!f)return m("Choose a backup file.");let j;try{j=JSON.parse(await f.text())}catch(_){return m("That file is not a valid backup.")}
    if(j.app!=="finsite"||!j.data)return m("That file is not a FINSITE backup.");const n=Object.values(j.data).reduce((a,l)=>a+l.length,0);if(!confirm(`Restore ${n} records? Records with the same ID are overwritten.`))return;
    try{let done=0;for(const [c,list] of Object.entries(j.data)){if(![...COLS,"settings"].includes(c))continue;for(let i=0;i<list.length;i+=200){const part=list.slice(i,i+200),b=writeBatch(db);part.forEach(r=>b.set(doc(db,c,r._id),des(r.d)));await b.commit();
        if(c==="registrations")try{const e=writeBatch(db);part.forEach(r=>{if(r.d.email)e.set(doc(db,"emails",r.d.eventId+"_"+encodeURIComponent(r.d.email)),{at:serverTimestamp()})});await e.commit()}catch(_){}
        done+=part.length;m(`Restored ${done} of ${n}…`)}}
      EV.t=0;Object.keys(RC).forEach(k=>delete RC[k]);m(`Restored ${done} records.`)}catch(x){m("Import stopped: "+x.message)}}}
</script></body></html>
