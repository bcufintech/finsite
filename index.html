const GAS_TPL=String.raw`// FINSITE mailer. Paste this whole file into script.google.com, then Deploy > New deployment > Web app.
// Execute as: Me. Who has access: Anyone. Only signed-in FINSITE admins can send (checked on every call).
const PROJECT_ID = "__PID__";
const API_KEY = "__KEY__";
const SENDER_NAME = "FINSPIRE - M.Com Fintech, BCU";
const MAX_PER_CALL = 50;

function doGet() { return out_({ ok: true, info: "FINSITE mailer is running" }); }

function doPost(e) {
  try {
    const b = JSON.parse(e.postData.contents);
    const uid = verify_(b.token);
    if (roleOf_(uid, b.token) !== "admin") return out_({ ok: false, error: "Only admins can send mail." });
    const mails = b.mails || [];
    if (!mails.length || mails.length > MAX_PER_CALL) return out_({ ok: false, error: "Bad batch size." });
    const left = MailApp.getRemainingDailyQuota();
    if (mails.length > left) return out_({ ok: false, error: "Daily mail limit reached. Left today: " + left });
    let sent = 0;
    const failed = [];
    mails.forEach(function (m) {
      try {
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.to)) throw new Error("bad address");
        const o = { to: m.to, subject: String(m.subject || "").slice(0, 200), htmlBody: String(m.html || ""), name: SENDER_NAME };
        if (m.replyTo && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.replyTo)) o.replyTo = m.replyTo;
        if (m.attachments && m.attachments.length) {
          o.attachments = m.attachments.slice(0, 3).map(function (a) {
            return Utilities.newBlob(Utilities.base64Decode(a.data), a.type || "image/jpeg", a.filename || "file");
          });
        }
        MailApp.sendEmail(o);
        sent++;
      } catch (err) { failed.push(m.to); }
    });
    return out_({ ok: true, sent: sent, failed: failed, quota: MailApp.getRemainingDailyQuota() });
  } catch (err) {
    return out_({ ok: false, error: String(err.message || err) });
  }
}

function verify_(token) {
  const r = UrlFetchApp.fetch("https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=" + API_KEY, {
    method: "post", contentType: "application/json", payload: JSON.stringify({ idToken: token }), muteHttpExceptions: true
  });
  if (r.getResponseCode() !== 200) throw new Error("Sign-in expired. Sign in to FINSITE again.");
  return JSON.parse(r.getContentText()).users[0].localId;
}

function roleOf_(uid, token) {
  const r = UrlFetchApp.fetch("https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents/admins/" + uid, {
    headers: { Authorization: "Bearer " + token }, muteHttpExceptions: true
  });
  if (r.getResponseCode() !== 200) return "";
  const f = JSON.parse(r.getContentText()).fields || {};
  return String((f.role || f.Role || {}).stringValue || "").trim().toLowerCase();
}

function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
`;

/* ============ FIREBASE RULES ============ */
const FS_RULES=String.raw`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // ---------- helpers ----------
    function signedIn() { return request.auth != null; }
    function adminPath() { return /databases/$(database)/documents/admins/$(request.auth.uid); }
    function role() {
      return signedIn() && exists(adminPath()) ? get(adminPath()).data.get('role', '') : '';
    }
    function isAdmin() { return role() == 'admin'; }
    function isStaff() { return role() == 'admin' || role() == 'coordinator' || role() == 'desk'; }
    function eventDoc(id) { return get(/databases/$(database)/documents/events/$(id)).data; }
    function isCoordOf(id) {
      return role() == 'coordinator'
        && request.auth.uid in eventDoc(id).get('coordinatorUids', []);
    }
    function isDeskOf(id) {
      return role() == 'desk'
        && request.auth.uid in eventDoc(id).get('deskUids', []);
    }

    // ---------- team (admins collection) ----------
    // Each signed-in user may read only their own doc (needed to find their role).
    match /admins/{uid} {
      allow get: if signedIn() && (request.auth.uid == uid || isAdmin());
      allow list: if isAdmin();
      allow write: if isAdmin();
    }

    // ---------- events ----------
    match /events/{eventId} {
      allow read: if resource.data.status in ['published', 'closed']
                  || isAdmin()
                  || (signedIn() && role() == 'coordinator'
                      && request.auth.uid in resource.data.get('coordinatorUids', []))
                  || (signedIn() && role() == 'desk'
                      && request.auth.uid in resource.data.get('deskUids', []));
      allow create, delete: if isAdmin();
      allow update: if isAdmin()
        || (isCoordOf(eventId)
            && request.resource.data.diff(resource.data).affectedKeys().hasOnly([
                 'date','start','end','venue','contactEmail','contactPhone',
                 'description','factsText','rulesText','judgingText','winner','questions',
                 'editedBy','editedAt']));
    }

    // ---------- general regulations ----------
    match /settings/{docId} {
      allow read: if true;
      allow write: if isAdmin();
    }

    // ---------- registrations ----------
    match /registrations/{regDocId} {
      // Public sign-up: create only, never read/update/delete.
      allow create: if (isAdmin())
        || (request.resource.data.keys().hasOnly(
              ['eventId','regId','name','email','phone','answers','checkedIn','createdAt'])
            && request.resource.data.keys().hasAll(
              ['eventId','regId','name','email','phone','checkedIn','createdAt'])
            && request.resource.data.eventId is string
            && request.resource.data.regId is string
            && request.resource.data.regId.matches('^[0-9]{6}$')
            && regDocId == request.resource.data.eventId + '_' + request.resource.data.regId
            && request.resource.data.name is string
            && request.resource.data.name.size() > 0 && request.resource.data.name.size() <= 100
            && request.resource.data.email is string
            && request.resource.data.email.size() <= 200
            && request.resource.data.email.matches('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
            && request.resource.data.phone is string
            && request.resource.data.phone.matches('^[6-9][0-9]{9}$')
            && request.resource.data.email == request.resource.data.email.lower()
            && (!('answers' in request.resource.data) || (request.resource.data.answers is map && request.resource.data.answers.size() <= 30))
            && request.resource.data.checkedIn == false
            && request.resource.data.createdAt == request.time
            && eventDoc(request.resource.data.eventId).status == 'published');

      allow read: if isAdmin() || isCoordOf(resource.data.eventId) || isDeskOf(resource.data.eventId);

      // Admin: anything (e.g. reverse check-in, restore).
      // Entry desk: may only flip checkedIn false -> true, stamped with own uid.
      // Coordinators can no longer check people in; they only see the result.
      allow update: if isAdmin()
        || (isDeskOf(resource.data.eventId)
            && request.resource.data.diff(resource.data).affectedKeys()
                 .hasOnly(['checkedIn','checkedInAt','checkedInBy'])
            && resource.data.checkedIn == false
            && request.resource.data.checkedIn == true
            && request.resource.data.checkedInBy == request.auth.uid
            && request.resource.data.checkedInAt == request.time);

      allow delete: if isAdmin();
    }

    // ---------- duplicate-email guard (one registration per email per event) ----------
    match /emails/{emailDocId} {
      // Admin only: public lookups would reveal which emails are registered.
      allow get: if isAdmin();
      allow list: if isAdmin();
      allow create: if isAdmin()
        || (request.resource.data.keys().hasOnly(['at'])
            && request.resource.data.at == request.time
            && eventDoc(emailDocId.split('_')[0]).status == 'published');
      allow update, delete: if isAdmin();
    }

    // ---------- results ----------
    match /results/{eventId} {
      allow read: if resource.data.status == 'published'
                  || isAdmin()
                  || isCoordOf(eventId);
      // Coordinator submits (cannot publish, cannot edit after publish).
      allow create: if isAdmin()
        || (isCoordOf(eventId)
            && request.resource.data.keys().hasOnly(
                 ['summary','fileUrl','status','submittedBy','submittedAt'])
            && request.resource.data.status == 'submitted'
            && request.resource.data.submittedBy == request.auth.uid
            && request.resource.data.submittedAt == request.time);
      allow update: if isAdmin()
        || (isCoordOf(eventId)
            && resource.data.status != 'published'
            && request.resource.data.keys().hasOnly(
                 ['summary','fileUrl','status','submittedBy','submittedAt'])
            && request.resource.data.status == 'submitted'
            && request.resource.data.submittedBy == request.auth.uid
            && request.resource.data.submittedAt == request.time);
      allow delete: if isAdmin();
    }

    // ---------- private settings (Google Script mail URL) ----------
    match /private/{docId} { allow read, write: if isAdmin(); }

    // ---------- admin-only collections ----------
    match /certs/{eventId}      { allow read, write: if isAdmin(); }
    match /volunteers/{id}      { allow read, write: if isAdmin(); }

    // ---------- audit log (append-only) ----------
    match /auditLogs/{id} {
      allow read: if isAdmin();
      allow create: if isStaff()
        && request.resource.data.keys().hasOnly(['action','reg','by','at'])
        && request.resource.data.by == request.auth.uid
        && request.resource.data.at == request.time
        && (isAdmin() || request.resource.data.action == 'duplicate');
      allow update, delete: if false;
    }

    // Everything else is closed.
    match /{document=**} { allow read, write: if false; }
  }
}
`;
const ST_RULES=String.raw`rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {

    function role() {
      return request.auth != null
        && firestore.exists(/databases/(default)/documents/admins/$(request.auth.uid))
        ? firestore.get(/databases/(default)/documents/admins/$(request.auth.uid)).data.get('role', '') : '';
    }
    // Admins anywhere; coordinators only for the events assigned to them.
    function canManage(eventId) {
      return role() == 'admin'
        || (role() == 'coordinator'
            && request.auth.uid in firestore.get(/databases/(default)/documents/events/$(eventId)).data.get('coordinatorUids', []));
    }

    // Results files: staff upload (max 10 MB, PDF / sheet / image), anyone with the link can view.
    match /results/{eventId}/{fileName} {
      allow read: if true;
      allow write: if canManage(eventId)
        && request.resource.size < 10 * 1024 * 1024
        && request.resource.contentType.matches('application/pdf|image/(png|jpeg|webp|gif)|application/vnd[.].*|text/csv');
      allow delete: if canManage(eventId);
    }

    match /{allPaths=**} { allow read, write: if false; }
  }
}
`;

  const m=t=>$("#bm").textContent=t;
  $("#bx").onclick=async()=>{m("Collecting data…");try{const out={app:"finsite",version:1,at:new Date().toISOString(),data:{}};for(const c of COLS)out.data[c]=(await getDocs(collection(db,c))).docs.map(d=>({_id:d.id,d:ser(d.data())}));const g=await getDoc(doc(db,"settings","general"));out.data.settings=g.exists()?[{_id:"general",d:g.data()}]:[];dl(new Blob([JSON.stringify(out)],{type:"application/json"}),"finsite-backup-"+new Date().toISOString().slice(0,10)+".json");m("Backup downloaded.")}catch(x){m("Export failed: "+x.message)}};
  $("#bxl").onclick=async()=>{m("Collecting data…");try{await loadX();const w=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(r.map(o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,safe(v)])))),n);
    add("Events",evs.map(e=>({Name:e.name,Date:e.date,Start:e.start||"",End:e.end||"",Venue:e.venue,Status:e.status,Coordinators:e.coordNames||"",Max:e.max||""})));
    add("Registrations",(await getDocs(collection(db,"registrations"))).docs.map(d=>d.data()).map(r=>({Event:N[r.eventId]||r.eventId,ID:r.regId,Name:r.name,Email:r.email,Mobile:r.phone||"",...r.answers,"Checked in":r.checkedIn?"Yes":"No"})));
    add("Volunteers",(await getDocs(collection(db,"volunteers"))).docs.map(d=>d.data()).map(v=>({Name:v.name,Mobile:v.phone,Email:v.email,Event:N[v.eventId]||"All",Role:v.role})));
    XLSX.writeFile(w,"finsite-all.xlsx");m("Excel downloaded.")}catch(x){m("Export failed: "+x.message)}};
  $("#bi").onclick=async()=>{const f=$("#bf").files[0];if(!f)return m("Choose a backup file.");let j;try{j=JSON.parse(await f.text())}catch(_){return m("That file is not a valid backup.")}
    if(j.app!=="finsite"||!j.data)return m("That file is not a FINSITE backup.");const n=Object.values(j.data).reduce((a,l)=>a+l.length,0);if(!confirm(`Restore ${n} records? Records with the same ID are overwritten.`))return;
    try{let done=0;for(const [c,list] of Object.entries(j.data)){if(![...COLS,"settings"].includes(c))continue;for(let i=0;i<list.length;i+=200){const part=list.slice(i,i+200),b=writeBatch(db);part.forEach(r=>b.set(doc(db,c,r._id),des(r.d)));await b.commit();
        if(c==="registrations")try{const e=writeBatch(db);part.forEach(r=>{if(r.d.email)e.set(doc(db,"emails",r.d.eventId+"_"+encodeURIComponent(r.d.email)),{at:serverTimestamp()})});await e.commit()}catch(_){}
        done+=part.length;m(`Restored ${done} of ${n}…`)}}
      EV.t=0;Object.keys(RC).forEach(k=>delete RC[k]);m(`Restored ${done} records.`)}catch(x){m("Import stopped: "+x.message)}}}
</script></body></html>
